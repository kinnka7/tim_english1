<style>
:root{--bg:#161826;--card:#20233a;--card2:#2a2e4a;--text:#e9e9ed;--mute:#9397ab;--line:#3a3f5c;--accent:#9184d9;--accent-l:#d2cefd;--accent-m:#b5abfc;--accent-d:#423a6a;--bad:#75798c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 500px at 0% 0%,#2b2741,transparent 70%),var(--bg);min-height:100vh;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#app{max-width:760px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3,h6{margin:0;font-weight:600}
h1{font-size:clamp(30px,7vw,44px);letter-spacing:-.02em;line-height:1.1}
h2{font-size:28px;letter-spacing:-.01em}
h3{font-size:22px}
h6{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h6.acc{color:var(--accent-m)}
p{margin:0}
.mute{color:var(--mute)}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 16px;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#14112a;font-weight:600}
.btn.pri:hover{background:var(--accent-m)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-l)}
.btn.ghost:hover{border-color:var(--line)}
.btn.sel{background:var(--accent);border-color:var(--accent);color:#14112a;font-weight:600}
.btn.key{min-width:42px;padding:6px 10px;min-height:42px;font-size:18px}
.btn.opt{width:100%;text-align:left;font-size:18px}
.topic{text-align:left;width:100%;border:0;display:flex;flex-direction:column;gap:2px;padding:16px 20px}
.topic b{font-size:17px;font-weight:600}
.topic span{font-size:13px;color:var(--mute)}
.input{font:inherit;font-size:20px;color:var(--text);background:#12142a;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:46px;width:100%;max-width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.input.sm{width:min(240px,100%)}
.input:disabled{opacity:.6}
.hint{font-size:13px;color:var(--mute)}
.top{display:flex;align-items:center;gap:14px}
.prog{flex:1;height:4px;border-radius:2px;background:#3f424d}
.prog i{display:block;height:4px;border-radius:2px;background:var(--accent);transition:width .25s}
.main{font-size:clamp(26px,6vw,34px);line-height:1.2;font-weight:600;letter-spacing:-.015em}
.sent{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:22px;line-height:1.5}
.back{font-size:26px;color:var(--accent-l);font-weight:600}
.fb{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:12px;background:var(--card)}
.fb .ic{font-size:26px;line-height:1}
.note{font-size:14px;color:var(--accent-l)}
.bars{display:flex;gap:32px;align-items:flex-end;margin-top:8px}
.bar{position:relative;width:96px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bar .n{font-size:22px;font-weight:600}
.bar .b{min-height:3px;border-radius:6px;transition:height .25s}
.bar .l{font-size:13px;color:var(--mute)}
.pop{display:none;position:absolute;left:0;bottom:calc(100% + 8px);z-index:5;min-width:190px;max-width:300px;max-height:220px;overflow:auto;padding:12px 16px;flex-direction:column;gap:4px;font-size:14px;background:var(--card2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop.on,.bar:hover .pop{display:flex}
.score{font-size:72px;line-height:1;font-weight:600;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--accent-d);color:var(--accent-l);font-size:14px}
.sp{height:1px;width:240px;background:linear-gradient(90deg,var(--accent),transparent)}
.mr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mr span:last-child{color:var(--accent-l)}
</style>
</head>

document.title = PAGE_TITLE;
const WORDS = V.map(([u, fr, de, ex, exde, note, alt]) => { const m = (ex || '').match(/\{(.+?)\}/); return { u, fr, de, ex: ex ? ex.replace(/[{}]/g, '') : '', exde: exde || '', note: note || '', alt: alt || [], gap: m ? m[1] : null, before: m ? ex.slice(0, m.index) : '', after: m ? ex.slice(m.index + m[0].length) : '' }; });
if (G.mix && G.mix.rows.trim() === 'ALLE') G.mix.rows = Object.keys(G).filter(k => k !== 'mix').map(k => G[k].rows).join('\n');
const GR = {}; Object.keys(G).forEach(k => GR[k] = G[k].rows.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [s, a, o] = l.split('|'); return { s, a: a.split('/').map(x => x.trim()), o: o ? o.split('/').map(x => x.trim()) : null }; }));
const LANGDE = 'Englisch', PH = 'English', CHARS = [];
const base = s => s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\(.*?\)/g, '').replace(/[.!?,;:]/g, '').replace(/\s+/g, ' ').trim();
const gn = base;
const wn = s => base(s).replace(/^(to|the|a|an)\s+/, '');   // "to", "the", "a" am Anfang sind egal



const FMT = { cards: 'Karten', type: 'Eintippen', fill: 'Lückensatz' };
const FMTHINT = { cards: 'Deutsches Wort sehen, ' + LANGDE + ' erinnern, umdrehen.', type: 'Deutsches Wort sehen, ' + LANGDE + ' eintippen. Ein falscher Buchstabe zählt als Fehler.', fill: 'Lücke im Beispielsatz füllen. Ein falscher Buchstabe zählt als Fehler.' };

const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wAns = (w, fmt) => (fmt === 'fill' && w.gap ? [w.gap] : [w.fr].concat(w.alt)).map(wn).filter(Boolean);

function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.words) return s; } catch (e) {} return { words: {}, gram: {}, hist: [] }; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S.store)); } catch (e) {} }
const S = { screen: 'home', wSrc: 'all', wN: 15, wFmt: 'cards', sess: null, open: null, store: load() };
const acc = r => { const n = r.ok + r.bad; return n ? Math.round(r.ok / n * 100) + ' %' : '–'; };

function pool(src, fmt) {
  const w = S.store.words;
  let p = WORDS.filter(x => src === 'all' || src === 'err' || x.u === src);
  if (src === 'err') p = p.filter(x => w[x.fr] && w[x.fr].last === 0);
  if (fmt === 'fill') p = p.filter(x => x.gap);
  return p;
}
function go(screen) { S.screen = screen; S.open = null; if (screen !== 'play' && screen !== 'result') S.sess = null; render(); window.scrollTo(0, 0); }
function startW(src, fmt) {
  src = src || S.wSrc; fmt = fmt || S.wFmt;
  const w = S.store.words;
  const pr = x => { const r = w[x.fr]; return !r ? 1 : r.last === 0 ? 0 : 2; };
  const items = shuf(pool(src, fmt)).sort((a, b) => pr(a) - pr(b)).slice(0, S.wN >= 999 ? 999 : S.wN);
  if (!items.length) return;
  S.sess = { kind: 'w', fmt, src, items, i: 0, checked: false, ok: null, flipped: false, log: [] };
  go('play');
}
function startG(key) { S.sess = { kind: 'g', fmt: 'gram', topic: key, items: shuf(GR[key]), i: 0, checked: false, ok: null, log: [] }; go('play'); }
function record(id, ok, kind) {
  const t = kind === 'w' ? S.store.words : S.store.gram;
  const r = t[id] || (t[id] = { ok: 0, bad: 0, last: 1 });
  ok ? r.ok++ : r.bad++; r.last = ok ? 1 : 0; persist();
}
function finish(log) {
  const s = S.sess; const ok = log.filter(x => x.ok).length;
  const label = s.kind === 'w' ? 'Wortschatz · ' + (s.src === 'err' ? 'Fehlerwörter' : SRC[s.src] || '') : 'Grammatik · ' + G[s.topic].name;
  S.store.hist = [{ t: Date.now(), label, ok, n: log.length }].concat(S.store.hist).slice(0, 30); persist();
  s.log = log; s.done = true; go('result');
}
function judge(s, it, val) {
  if (s.kind === 'w') { const v = wn(val); return !!v && wAns(it, s.fmt).includes(v); }
  const v = gn(val); return !!v && it.a.map(gn).includes(v);
}
function answer(ok, val) {
  const s = S.sess; if (s.checked) return; const it = s.items[s.i];
  record(s.kind === 'w' ? it.fr : s.topic, ok, s.kind);
  s.log.push({ ok, it, val }); s.checked = true; s.ok = ok; s.val = val; render();
}
function check() { const s = S.sess; if (!s || s.checked) return; const el = document.getElementById('ans'); if (!el || !el.value.trim()) return; answer(judge(s, s.items[s.i], el.value), el.value); }
function next() {
  const s = S.sess; const i = s.i + 1;
  if (i >= s.items.length) return finish(s.log);
  s.i = i; s.checked = false; s.ok = null; s.flipped = false; s.val = null; render();
}
function cardNext(ok) {
  const s = S.sess; record(s.items[s.i].fr, ok, 'w'); s.log.push({ ok, it: s.items[s.i] });
  const i = s.i + 1; if (i >= s.items.length) return finish(s.log);
  s.i = i; s.flipped = false; render();
}
function retry() {
  const s = S.sess; s.items = s.log.filter(x => !x.ok).map(x => x.it); s.i = 0; s.checked = false; s.ok = null; s.flipped = false; s.log = []; s.done = false; s.val = null; go('play');
}

  const typed = (w && !cards) || gtyped;
  let h = '<div class="col" style="gap:28px;padding-top:8px">';
  h += '<div class="top">' + btn('quit', undefined, '✕ Zum Menü') + '<div class="prog"><i style="width:' + Math.round(s.i / s.items.length * 100) + '%"></i></div><span class="mute" style="font-size:13px;min-width:48px;text-align:right">' + (s.i + 1) + ' / ' + s.items.length + '</span></div>';
  h += '<div class="col" style="gap:20px;min-height:260px"><h6 class="acc">' + (w ? (cards ? 'Wort' : fill ? 'Lückensatz' : LANGDE + ' eintippen') : esc(G[s.topic].name)) + '</h6>';
  if (w) h += '<div class="main">' + esc(it.de) + '</div>';
  if (cards) {
    if (s.flipped) {
      h += '<div class="card col" style="gap:10px"><div class="back">' + esc(it.fr) + '</div>' + (it.ex ? '<div style="font-size:18px">' + esc(it.ex) + '</div>' : '') + (it.exde ? '<div class="mute">' + esc(it.exde) + '</div>' : '') + (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') + '</div>' +
        '<div class="row">' + btn('know', undefined, '✓ Gewusst', 'pri') + btn('notyet', undefined, '↺ Noch nicht') + '</div>';
    } else h += '<div>' + btn('flip', undefined, 'Umdrehen') + '</div>';
  }
  if (typed) {
    const dis = s.checked ? ' disabled' : '';
    let pre = '', post = '';
    if (fill) { pre = it.before.trim(); post = it.after.trim(); } else if (gtyped) { const gs = it.s.split('___'); pre = gs[0].trim(); post = (gs[1] || '').trim(); }
    h += '<div class="sent">' + (pre ? '<span>' + esc(pre) + '</span>' : '') +
      '<input id="ans" class="input' + (fill || gtyped ? ' sm' : '') + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (fill || gtyped ? '…' : PH) + '" value="' + esc(s.val || '') + '"' + dis + '>' +
      (post ? '<span>' + esc(post) + '</span>' : '') + '</div>';
    if (!s.checked && CHARS.length) h += '<div class="row" style="gap:8px">' + CHARS.map(c => '<button class="btn key" data-a="char" data-v="' + c + '">' + c + '</button>').join('') + '</div>';
  }
  if (choice) {
    const gs = it.s.split('___');
    h += '<div class="main">' + esc(gs[0].trim()) + ' ___ ' + esc((gs[1] || '').trim()) + '</div><div class="col" style="gap:10px;max-width:420px">' +
      it.o.map((o, idx) => { let st = ''; if (s.checked) { if (o === it.a[0]) st = 'background:var(--accent-d);border-color:var(--accent)'; else if (o === s.val) st = 'opacity:.5;text-decoration:line-through'; else st = 'opacity:.45'; } return '<button class="btn opt" style="' + st + '" data-a="choice" data-v="' + idx + '">' + esc(o) + '</button>'; }).join('') + '</div>';
  }
  if (s.checked && !cards) {
    const correct = w ? (fill && it.gap ? it.gap : it.fr) : it.a.join(' / ');
    const txt = s.ok ? (w && it.ex ? it.fr + ' · ' + it.ex : '') : 'Richtig: ' + correct + (w && it.note ? ' · ' + it.note : '');
    h += '<div class="fb" style="box-shadow:0 0 0 1px ' + (s.ok ? 'var(--accent)' : 'var(--mute)') + '"><span class="ic" style="color:' + (s.ok ? 'var(--accent)' : 'var(--mute)') + '">' + (s.ok ? '✓' : '✗') + '</span><div><div style="font-weight:600">' + (s.ok ? 'Richtig' : 'Nicht ganz') + '</div>' + (txt ? '<div style="color:#cfd3e5">' + esc(txt) + '</div>' : '') + '</div></div>';
  }
  h += '</div>';
  if (typed && !s.checked) h += '<div>' + btn('check', undefined, 'Prüfen', 'pri') + '</div>';
  if (s.checked && !cards) h += '<div>' + btn('next', undefined, (s.i + 1 >= s.items.length ? 'Ergebnis' : 'Weiter') + ' →', 'pri') + '</div>';
  h += vBars() + '</div>';
  return h;
}
function vResult() {
  const s = S.sess; const ok = s.log.filter(x => x.ok).length, n = s.log.length, bad = s.log.filter(x => !x.ok); const w = s.kind === 'w';
  return '<div class="col" style="gap:24px;padding-top:20px"><h6 class="acc">' + (w ? 'Wortschatz' : esc(G[s.topic].name)) + '</h6>' +
    '<div class="row" style="align-items:baseline;gap:14px"><span class="score">' + ok + '</span><span class="mute" style="font-size:22px">/ ' + n + '</span></div>' +
    '<p style="color:#cfd3e5">' + (ok === n ? 'Alles richtig.' : ok / n >= 0.7 ? 'Gut. Die Fehler unten kurz wiederholen.' : 'Die Fehler unten noch einmal üben.') + '</p>' +
    (bad.length ? '<div class="card col" style="gap:10px"><h6>Zum Wiederholen</h6>' + bad.map(x => '<div class="mr"><span>' + esc(w ? x.it.de : x.it.s) + '</span><span>' + esc(w ? x.it.fr : x.it.a[0]) + '</span></div>').join('') + '</div>' : '') +
    '<div class="row">' + (bad.length ? btn('retry', undefined, '↺ Fehler wiederholen', 'pri') : '') + btn('again', undefined, 'Neue Runde') + btn('home', undefined, 'Zum Menü', 'ghost') + '</div></div>';
}
function vParent() {
  const st = S.store;
  const rows = SRCK.map(u => { const ws = WORDS.filter(x => x.u === u); let ok = 0, bad = 0, m = 0; ws.forEach(x => { const r = st.words[x.fr]; if (r) { ok += r.ok; bad += r.bad; if (r.ok - r.bad >= 2) m++; } }); return '<tr><td>' + esc(SRC[u]) + '</td><td>' + ws.length + '</td><td>' + m + '</td><td>' + acc({ ok, bad }) + '</td></tr>'; }).join('');
  const gram = Object.keys(G).map(k => { const r = st.gram[k] || { ok: 0, bad: 0 }; return '<tr><td>' + esc(G[k].name) + '</td><td>' + (r.ok + r.bad) + '</td><td>' + acc(r) + '</td></tr>'; }).join('');
  const weak = WORDS.filter(x => { const r = st.words[x.fr]; return r && r.bad > 0 && r.bad >= r.ok; }).slice(0, 20);
  const hist = st.hist.slice(0, 8);
  return '<div class="col" style="gap:28px;padding-top:8px">' + btn('home', undefined, '← Zurück', 'ghost') + '<h2>Elternbereich</h2>' +
    '<div class="col" style="gap:10px"><h6>Wortschatz</h6><table><thead><tr><th>Bereich</th><th>Wörter</th><th>Gelernt</th><th>Trefferquote</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="col" style="gap:10px"><h6>Grammatik</h6><table><thead><tr><th>Thema</th><th>Aufgaben</th><th>Trefferquote</th></tr></thead><tbody>' + gram + '</tbody></table></div>' +
    '<div class="col" style="gap:10px"><h6>Schwierige Wörter</h6>' + (weak.length ? '<div class="row" style="gap:8px">' + weak.map(x => '<span class="tag">' + esc(x.fr) + '</span>').join('') + '</div>' : '<p class="mute">Noch keine Fehler erfasst.</p>') + '</div>' +
    '<div class="col" style="gap:10px"><h6>Letzte Runden</h6>' + (hist.length ? '<table><tbody>' + hist.map(h => '<tr><td>' + new Date(h.t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + '</td><td>' + esc(h.label) + '</td><td>' + h.ok + ' / ' + h.n + '</td></tr>').join('') + '</tbody></table>' : '<p class="mute">Noch keine Runden.</p>') + '</div>' +
    '<div>' + btn('reset', undefined, '🗑 Ergebnisse zurücksetzen', 'ghost') + '</div></div>';
}
function render() {
  const v = { home: vHome, wsetup: vWSetup, gsetup: vGSetup, play: vPlay, result: vResult, parent: vParent }[S.screen];
  document.getElementById('app').innerHTML = v();
  const el = document.getElementById('ans'); if (el && !el.disabled) el.focus();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v, s = S.sess;
  switch (a) {
    case 'home': case 'wsetup': case 'gsetup': case 'parent': return go(a);
    case 'quit': return go('home');
    case 'wsrc': S.wSrc = v; return render();
    case 'wfmt': S.wFmt = v; return render();
    case 'wn': S.wN = +v; return render();
    case 'start-w': return startW();
    case 'start-g': return startG(v);
    case 'start-err': S.wSrc = 'err'; return startW('err', 'type');
    case 'flip': s.flipped = true; return render();
    case 'know': return cardNext(true);
    case 'notyet': return cardNext(false);
    case 'check': return check();
    case 'next': return next();
    case 'choice': { const it = s.items[s.i]; const o = it.o[+v]; return answer(o === it.a[0], o); }
    case 'char': { const el = document.getElementById('ans'); if (el && !el.disabled) { el.value += v; el.focus(); } return; }
    case 'bar': S.open = S.open === v ? null : v; return render();
    case 'retry': return retry();
    case 'again': return s.kind === 'w' ? startW(s.src, s.fmt) : startG(s.topic);
    case 'reset': if (confirm('Alle gespeicherten Ergebnisse löschen?')) { S.store = { words: {}, gram: {}, hist: [] }; persist(); render(); } return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.screen !== 'play' || !S.sess) return;
  if (S.sess.checked) { e.preventDefault(); next(); }
  else if (e.target && e.target.id === 'ans') check();
});
render();
</script>
</body>
</html>
